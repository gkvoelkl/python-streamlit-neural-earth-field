[project]
name = "python-streamlit-neural-earth-field"
version = "0.1.0"
description = "The Earth as a neural field: compressing global elevation data into network weights"
readme = "README.md"
authors = [
    { name = "gkvoelkl", email = "gkvoelkl@nelson-games.de" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "xarray>=2026.7.0",
]

[project.scripts]
python-streamlit-neural-earth-field = "python_streamlit_neural_earth_field:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
]
