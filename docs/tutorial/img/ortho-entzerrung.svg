<rect width="940" height="500" rx="12" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">Warum ein Luftbild verzerrt ist – und ein Orthofoto nicht</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Schnitt durch das Gelände mit einem Hügel und einem hohen Haus. Die blauen Punkte liegen in gleichen Abständen.</text>
