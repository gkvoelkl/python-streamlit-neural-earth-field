<text x="28" y="434" font-size="13.5" fill="#1f2933" font-weight="600">Luftbild: alle Strahlen gehen durch die Kamera</text>
<text x="28" y="454" font-size="12.5" fill="#5f6b7a">Auf die Karte gelegt rücken hohe Punkte nach außen:</text>
<text x="28" y="472" font-size="12.5" fill="#5f6b7a">der Hügel wird gedehnt, das Dach (rot) kippt vom Haus weg.</text>
<text x="492" y="434" font-size="13.5" fill="#1f2933" font-weight="600">Orthofoto: jeder Punkt senkrecht nach unten</text>
<text x="492" y="454" font-size="12.5" fill="#5f6b7a">Mit einem Geländemodell entzerrt: gleiche Abstände</text>
<text x="492" y="472" font-size="12.5" fill="#5f6b7a">im Gelände sind gleiche Abstände im Bild.</text>
<text x="260" y="90" font-size="12" fill="#1f2933">Kamera</text>
<text x="448" y="418" font-size="11.5" fill="#5f6b7a" text-anchor="end">Bild auf der Karte</text>
<text x="912" y="418" font-size="11.5" fill="#5f6b7a" text-anchor="end">Bild auf der Karte</text>
</svg>
