<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Ein Neuron: Eingaben mal Gewichte, Summe plus Grundwert, dann ein Knick">
<rect width="880" height="330" rx="12" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker></defs>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">Ein Neuron: gewichtete Summe, dann ein Knick</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Jedes Neuron rechnet dasselbe – nur mit eigenen Gewichten</text>
<circle cx="80" cy="140" r="26" fill="#2a86b0" fill-opacity="0.12" stroke="#2a86b0" stroke-width="1.5"/>
<text x="80.0" y="145.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Länge</text>
<circle cx="80" cy="240" r="26" fill="#2a86b0" fill-opacity="0.12" stroke="#2a86b0" stroke-width="1.5"/>
<text x="80.0" y="245.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Breite</text>
<line x1="108" y1="146" x2="268" y2="176" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="108" y1="234" x2="268" y2="204" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="175.0" y="144.0" font-size="12.5" fill="#5f6b7a" text-anchor="middle">× Gewicht 1</text>
<text x="175.0" y="246.0" font-size="12.5" fill="#5f6b7a" text-anchor="middle">× Gewicht 2</text>
<rect x="272" y="146" width="170" height="88" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.3"/>
<text x="357.0" y="176.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">addieren</text>
<text x="357.0" y="198.0" font-size="12.5" fill="#5f6b7a" text-anchor="middle">+ Grundwert</text>
<text x="357.0" y="218.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">(auch ein Gewicht)</text>
<line x1="446" y1="190" x2="506" y2="190" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="510" y="130" width="170" height="120" rx="10" fill="#2a86b0" fill-opacity="0.08" stroke="#2a86b0" stroke-width="2"/>
<text x="595.0" y="154.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">Knick</text>
<line x1="540" y1="230" x2="650" y2="230" stroke="#e3e8ed" stroke-width="1"/>
<polyline points="540,230 595,230 650,175" fill="none" stroke="#2a86b0" stroke-width="3"/>
<text x="544.0" y="224.0" font-size="11" fill="#5f6b7a" text-anchor="start">0</text>
<line x1="684" y1="190" x2="744" y2="190" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="780" cy="190" r="28" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
<text x="780.0" y="195.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="600">Ergebnis</text>
<text x="28.0" y="300.0" font-size="12.5" fill="#5f6b7a" text-anchor="start">Knick: Negative Summen werden zu 0, positive bleiben, wie sie sind. Ohne Knick bliebe auch ein großes Netz eine einzige gewichtete Summe.</text>
</svg>