<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Ein Trainingsschritt in vier Teilen, 4000-mal wiederholt">
<rect width="860" height="460" rx="12" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker></defs>
<text x="28" y="40" font-size="19" font-weight="600" fill="#1f2933">Ein Trainingsschritt – 4 000-mal wiederholt</text>
<text x="28" y="64" font-size="13.5" fill="#5f6b7a">Einfaches Netz aus Kapitel 2: Jeder Schritt verbessert alle 50 049 Gewichte ein kleines Stück</text>
<rect x="60" y="96" width="300" height="104" rx="10" fill="none" fill-opacity="1" stroke="#8a96a3" stroke-width="1.3"/>
<text x="78" y="128" font-size="15" font-weight="600" fill="#1f2933">1 · Stichprobe ziehen</text>
<text x="78" y="154" font-size="13.5" fill="#5f6b7a">32 768 zufällige Zellen</text>
<text x="78" y="174" font-size="13.5" fill="#5f6b7a">aus dem Raster</text>
<rect x="500" y="96" width="300" height="104" rx="10" fill="none" fill-opacity="1" stroke="#8a96a3" stroke-width="1.3"/>
<text x="518" y="128" font-size="15" font-weight="600" fill="#1f2933">2 · Netz rechnet</text>
<text x="518" y="154" font-size="13.5" fill="#5f6b7a">für jede Zelle eine Höhe</text>
<text x="518" y="174" font-size="13.5" fill="#5f6b7a">aus Länge und Breite</text>
<rect x="500" y="300" width="300" height="104" rx="10" fill="none" fill-opacity="1" stroke="#8a96a3" stroke-width="1.3"/>
<text x="518" y="332" font-size="15" font-weight="600" fill="#1f2933">3 · Fehler messen</text>
<text x="518" y="358" font-size="13.5" fill="#5f6b7a">Abstand zur echten Höhe</text>
<text x="518" y="378" font-size="13.5" fill="#5f6b7a">im Raster, gemittelt</text>
<rect x="60" y="300" width="300" height="104" rx="10" fill="#2a86b0" fill-opacity="0.1" stroke="#2a86b0" stroke-width="2"/>
<text x="78" y="332" font-size="15" font-weight="600" fill="#1f2933">4 · Gewichte nachstellen</text>
<text x="78" y="358" font-size="13.5" fill="#5f6b7a">jedes Gewicht ein Stück in die</text>
<text x="78" y="378" font-size="13.5" fill="#5f6b7a">Richtung, die den Fehler verkleinert</text>
<line x1="366" y1="148" x2="494" y2="148" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="650" y1="206" x2="650" y2="294" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="494" y1="352" x2="366" y2="352" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="210" y1="294" x2="210" y2="206" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="430" y="246" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">nächster Schritt</text>
<text x="430" y="268" font-size="12.5" fill="#5f6b7a" text-anchor="middle">mit neuen Zellen</text>
<text x="28" y="438" font-size="12.5" fill="#5f6b7a">4 000 Schritte × 32 768 Zellen: Jede der 2,3 Millionen Rasterzellen kommt im Mittel rund 56-mal an die Reihe.</text>
</svg>