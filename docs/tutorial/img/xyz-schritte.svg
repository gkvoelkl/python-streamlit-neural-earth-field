<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Berechnung von x, y und z in drei Schritten am Beispiel Regensburg">
<rect width="980" height="560" rx="12" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">x, y und z in drei Schritten</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Beispiel Regensburg: Länge 12,1° Ost, Breite 49,0° Nord – die Erde als Kugel mit Radius 1</text>
<text x="170.0" y="100.0" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="600">1 · Höhe über dem Äquator</text>
<text x="170.0" y="120.0" font-size="12" fill="#5f6b7a" text-anchor="middle">Seitenansicht</text>
<text x="490.0" y="100.0" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="600">2 · Richtung 0° Ost</text>
<text x="490.0" y="120.0" font-size="12" fill="#5f6b7a" text-anchor="middle">Blick von oben auf den Nordpol</text>
<text x="810.0" y="100.0" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="600">3 · Richtung 90° Ost</text>
<text x="810.0" y="120.0" font-size="12" fill="#5f6b7a" text-anchor="middle">Blick von oben auf den Nordpol</text>
<circle cx="170" cy="300" r="120" fill="#2a86b0" fill-opacity="0.06" stroke="#8a96a3" stroke-width="1.4"/>
<line x1="40.0" y1="300.0" x2="300.0" y2="300.0" stroke="#d5dbe1" stroke-width="1.3"/>
<text x="54.0" y="316.0" font-size="11" fill="#5f6b7a" text-anchor="start">Äquator</text>
<line x1="170.0" y1="430.0" x2="170.0" y2="170.0" stroke="#d5dbe1" stroke-width="1.3"/>
<text x="176.0" y="166.0" font-size="11" fill="#5f6b7a" text-anchor="start">Nordpol</text>
<line x1="170.0" y1="300.0" x2="248.7" y2="209.4" stroke="#1f2933" stroke-width="1.6"/>
<circle cx="248.7" cy="209.4" r="6" fill="#2a86b0"/>
<line x1="248.7" y1="209.4" x2="248.7" y2="300.0" stroke="#c0622a" stroke-width="2.4"/>
<line x1="170.0" y1="300.0" x2="248.7" y2="300.0" stroke="#2a86b0" stroke-width="2.4"/>
<path d="M204.0 300.0 A34 34 0 0 0 192.3 274.3" fill="none" stroke="#1f2933" stroke-width="1.4"/>
<text x="210.0" y="288.0" font-size="12" fill="#1f2933" text-anchor="start">49,0°</text>
<text x="256.7" y="258.7" font-size="13" fill="#c0622a" text-anchor="start" font-weight="600">z = 0,75</text>
<text x="209.4" y="320.0" font-size="13" fill="#2a86b0" text-anchor="middle" font-weight="600">r = 0,66</text>
<text x="170.0" y="472.0" font-size="12.5" fill="#1f2933" text-anchor="middle">z = sin(Breite) = sin(49,0°) = 0,75</text>
<text x="170.0" y="492.0" font-size="12.5" fill="#5f6b7a" text-anchor="middle">r = cos(Breite) = 0,66: Abstand zur Erdachse</text>
<circle cx="490" cy="300" r="120" fill="none" stroke="#d5dbe1" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="490" cy="300" r="78.7" fill="#2a86b0" fill-opacity="0.06" stroke="#8a96a3" stroke-width="1.4"/>
<line x1="360.0" y1="300.0" x2="620.0" y2="300.0" stroke="#d5dbe1" stroke-width="1.3"/>
<line x1="490.0" y1="430.0" x2="490.0" y2="170.0" stroke="#d5dbe1" stroke-width="1.3"/>
<text x="622.0" y="304.0" font-size="11" fill="#5f6b7a" text-anchor="start">0° O</text>
<text x="494.0" y="166.0" font-size="11" fill="#5f6b7a" text-anchor="start">90° O</text>
<line x1="490.0" y1="300.0" x2="567.0" y2="283.5" stroke="#1f2933" stroke-width="1.6"/>
<circle cx="567.0" cy="283.5" r="6" fill="#2a86b0"/>
<path d="M536.0 300.0 A46 46 0 0 0 535.0 290.4" fill="none" stroke="#1f2933" stroke-width="1.4"/>
<text x="504.0" y="274.0" font-size="12" fill="#1f2933" text-anchor="start">12,1°</text>
<text x="482.0" y="320.0" font-size="10.5" fill="#5f6b7a" text-anchor="end">Mittelpunkt</text>
<line x1="490.0" y1="303.0" x2="567.0" y2="303.0" stroke="#c0622a" stroke-width="2.6"/>
<line x1="567.0" y1="283.5" x2="567.0" y2="300.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="5 4"/>
<text x="528.5" y="340.0" font-size="13" fill="#c0622a" text-anchor="middle" font-weight="600">x = 0,64</text>
<text x="490.0" y="472.0" font-size="12.5" fill="#1f2933" text-anchor="middle">x = r · cos(Länge) = 0,66 · cos(12,1°) = 0,64</text>
<text x="490.0" y="492.0" font-size="12.5" fill="#5f6b7a" text-anchor="middle">Kreis: alle Orte auf 49° Nord (Radius r = 0,66)</text>
<circle cx="810" cy="300" r="120" fill="none" stroke="#d5dbe1" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="810" cy="300" r="78.7" fill="#2a86b0" fill-opacity="0.06" stroke="#8a96a3" stroke-width="1.4"/>
<line x1="680.0" y1="300.0" x2="940.0" y2="300.0" stroke="#d5dbe1" stroke-width="1.3"/>
<line x1="810.0" y1="430.0" x2="810.0" y2="170.0" stroke="#d5dbe1" stroke-width="1.3"/>
<text x="942.0" y="304.0" font-size="11" fill="#5f6b7a" text-anchor="start">0° O</text>
<text x="814.0" y="166.0" font-size="11" fill="#5f6b7a" text-anchor="start">90° O</text>
<line x1="810.0" y1="300.0" x2="887.0" y2="283.5" stroke="#1f2933" stroke-width="1.6"/>
<circle cx="887.0" cy="283.5" r="6" fill="#2a86b0"/>
<path d="M856.0 300.0 A46 46 0 0 0 855.0 290.4" fill="none" stroke="#1f2933" stroke-width="1.4"/>
<text x="824.0" y="274.0" font-size="12" fill="#1f2933" text-anchor="start">12,1°</text>
<text x="802.0" y="320.0" font-size="10.5" fill="#5f6b7a" text-anchor="end">Mittelpunkt</text>
<line x1="887.0" y1="300.0" x2="887.0" y2="283.5" stroke="#c0622a" stroke-width="2.6"/>
<line x1="810.0" y1="300.0" x2="887.0" y2="300.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="5 4"/>
<text x="895.0" y="272.0" font-size="13" fill="#c0622a" text-anchor="start" font-weight="600">y = 0,14</text>
<text x="810.0" y="472.0" font-size="12.5" fill="#1f2933" text-anchor="middle">y = r · sin(Länge) = 0,66 · sin(12,1°) = 0,14</text>
<text x="810.0" y="492.0" font-size="12.5" fill="#5f6b7a" text-anchor="middle">Kreis: alle Orte auf 49° Nord (Radius r = 0,66)</text>
<text x="28.0" y="538.0" font-size="12.5" fill="#5f6b7a" text-anchor="start">Erst bestimmt die Breite, wie hoch der Punkt liegt (z) und wie weit er von der Erdachse entfernt ist (r). Dann verteilt die Länge r auf x und y.</text>
</svg>