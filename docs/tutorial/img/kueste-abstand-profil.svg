<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Von 20° West über Portugal, Spanien, das Mittelmeer, Sardinien und Italien bis 30° Ost.</text>
<text x="28.0" y="82.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">An Land positiv, im Meer negativ – die Küste ist genau dort, wo die Kurve die 0-Linie kreuzt.</text>
