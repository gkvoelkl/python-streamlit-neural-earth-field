<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A point on the unit sphere, described by x, y and z">
<rect width="940" height="500" rx="12" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0622a"/></marker></defs>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">Three numbers instead of two: the point on the sphere</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">The Earth as a sphere with radius 1, the origin at the centre of the Earth</text>
<circle cx="250" cy="300" r="150" fill="#2a86b0" fill-opacity="0.07" stroke="#8a96a3" stroke-width="1.5"/>
<ellipse cx="250" cy="300" rx="150" ry="45.0" fill="none" stroke="#b8c1cc"/>
<ellipse cx="250" cy="300" rx="67.5" ry="150" fill="none" stroke="#b8c1cc"/>
<text x="92.0" y="304.0" font-size="11" fill="#5f6b7a" text-anchor="end">Equator</text>
<line x1="250" y1="300" x2="135" y2="415" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrA)"/>
<line x1="250" y1="300" x2="455" y2="300" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrA)"/>
<line x1="250" y1="300" x2="250" y2="105" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrA)"/>
<text x="129.0" y="433.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">x  (towards 0° E, 0° N)</text>
<text x="451.0" y="290.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600">y  (towards 90° E, 0° N)</text>
<text x="260.0" y="111.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600">z  (towards the North Pole)</text>
<line x1="250" y1="300" x2="220.7" y2="236.7" stroke="#2a86b0" stroke-width="2"/>
<circle cx="220.7" cy="236.7" r="6" fill="#2a86b0"/>
<text x="230.7" y="230.7" font-size="12.5" fill="#2a86b0" text-anchor="start" font-weight="600">Regensburg</text>
<circle cx="250" cy="300" r="3" fill="#1f2933"/>
<text x="560.0" y="140.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="600">From longitude and latitude:</text>
<text x="560.0" y="172.0" font-size="14" fill="#1f2933" text-anchor="start">x = cos(latitude) · cos(longitude)</text>
<text x="560.0" y="198.0" font-size="14" fill="#1f2933" text-anchor="start">y = cos(latitude) · sin(longitude)</text>
<text x="560.0" y="224.0" font-size="14" fill="#1f2933" text-anchor="start">z = sin(latitude)</text>
<text x="560.0" y="266.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">Regensburg (12.1° E, 49.0° N):</text>
<text x="560.0" y="288.0" font-size="13" fill="#2a86b0" text-anchor="start">x = 0.64   y = 0.14   z = 0.75</text>
<text x="560.0" y="330.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">Close on Earth = close in x, y, z:</text>
<text x="560.0" y="352.0" font-size="12.5" fill="#5f6b7a" text-anchor="start">179.9° E:  x = −1.000  y = +0.002</text>
<text x="560.0" y="372.0" font-size="12.5" fill="#5f6b7a" text-anchor="start">179.9° W: x = −1.000  y = −0.002</text>
<text x="28.0" y="480.0" font-size="12.5" fill="#5f6b7a" text-anchor="start">No edges, no seam: every point on Earth has exactly one description, and neighbours have similar numbers.</text>
</svg>