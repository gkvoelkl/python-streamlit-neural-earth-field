<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="MAE: mean of the absolute errors, compared with the RMSE">
<rect width="860" height="400" rx="12" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">MAE: the average absolute error</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Each error without its sign as a bar. The mean is the MAE – the RMSE is higher because of cell D.</text>
<line x1="90" x2="700" y1="320.0" y2="320.0" stroke="#8a96a3"/>
<text x="82.0" y="324.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">0</text>
<line x1="90" x2="700" y1="280.0" y2="280.0" stroke="#e3e8ed"/>
<text x="82.0" y="284.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">100</text>
<line x1="90" x2="700" y1="240.0" y2="240.0" stroke="#e3e8ed"/>
<text x="82.0" y="244.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">200</text>
<line x1="90" x2="700" y1="200.0" y2="200.0" stroke="#e3e8ed"/>
<text x="82.0" y="204.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">300</text>
<line x1="90" x2="700" y1="160.0" y2="160.0" stroke="#e3e8ed"/>
<text x="82.0" y="164.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">400</text>
<line x1="90" x2="700" y1="120.0" y2="120.0" stroke="#e3e8ed"/>
<text x="82.0" y="124.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">500</text>
<text x="28.0" y="88.0" font-size="12" fill="#5f6b7a" text-anchor="start">Absolute error [m]</text>
<rect x="132" y="280.0" width="56" height="40.0" fill="#b8c1cc"/>
<text x="160.0" y="272.0" font-size="12" fill="#1f2933" text-anchor="middle">100 m</text>
<text x="160.0" y="342.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell A</text>
<rect x="252" y="280.0" width="56" height="40.0" fill="#b8c1cc"/>
<text x="280.0" y="272.0" font-size="12" fill="#1f2933" text-anchor="middle">100 m</text>
<text x="280.0" y="342.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell B</text>
<rect x="372" y="280.0" width="56" height="40.0" fill="#b8c1cc"/>
<text x="400.0" y="272.0" font-size="12" fill="#1f2933" text-anchor="middle">100 m</text>
<text x="400.0" y="342.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell C</text>
<rect x="492" y="120.0" width="56" height="200.0" fill="#b8c1cc"/>
<text x="520.0" y="112.0" font-size="12" fill="#1f2933" text-anchor="middle">500 m</text>
<text x="520.0" y="342.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell D</text>
<rect x="612" y="280.0" width="56" height="40.0" fill="#b8c1cc"/>
<text x="640.0" y="272.0" font-size="12" fill="#1f2933" text-anchor="middle">100 m</text>
<text x="640.0" y="342.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell E</text>
<line x1="90" x2="700" y1="248.0" y2="248.0" stroke="#2a86b0" stroke-width="2"/>
<text x="712.0" y="252.0" font-size="13" fill="#2a86b0" text-anchor="start" font-weight="600">MAE = 180 m</text>
<line x1="90" x2="700" y1="223.7" y2="223.7" stroke="#1f2933" stroke-width="2" stroke-dasharray="6 4"/>
<text x="712.0" y="227.7" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">RMSE = 241 m</text>
</svg>