<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One training step in four parts, repeated 4000 times">
<rect width="860" height="460" rx="12" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker></defs>
<text x="28" y="40" font-size="19" font-weight="600" fill="#1f2933">One training step – repeated 4 000 times</text>
<text x="28" y="64" font-size="13.5" fill="#5f6b7a">Simple network from chapter 2: each step improves all 50 049 weights a little</text>
<rect x="60" y="96" width="300" height="104" rx="10" fill="none" fill-opacity="1" stroke="#8a96a3" stroke-width="1.3"/>
<text x="78" y="128" font-size="15" font-weight="600" fill="#1f2933">1 · Draw a sample</text>
<text x="78" y="154" font-size="13.5" fill="#5f6b7a">32 768 random cells</text>
<text x="78" y="174" font-size="13.5" fill="#5f6b7a">from the grid</text>
<rect x="500" y="96" width="300" height="104" rx="10" fill="none" fill-opacity="1" stroke="#8a96a3" stroke-width="1.3"/>
<text x="518" y="128" font-size="15" font-weight="600" fill="#1f2933">2 · Network computes</text>
<text x="518" y="154" font-size="13.5" fill="#5f6b7a">an elevation for each cell</text>
<text x="518" y="174" font-size="13.5" fill="#5f6b7a">from longitude and latitude</text>
<rect x="500" y="300" width="300" height="104" rx="10" fill="none" fill-opacity="1" stroke="#8a96a3" stroke-width="1.3"/>
<text x="518" y="332" font-size="15" font-weight="600" fill="#1f2933">3 · Measure the error</text>
<text x="518" y="358" font-size="13.5" fill="#5f6b7a">distance to the true elevation</text>
<text x="518" y="378" font-size="13.5" fill="#5f6b7a">in the grid, averaged</text>
<rect x="60" y="300" width="300" height="104" rx="10" fill="#2a86b0" fill-opacity="0.1" stroke="#2a86b0" stroke-width="2"/>
<text x="78" y="332" font-size="15" font-weight="600" fill="#1f2933">4 · Adjust the weights</text>
<text x="78" y="358" font-size="13.5" fill="#5f6b7a">each weight a little in the</text>
<text x="78" y="378" font-size="13.5" fill="#5f6b7a">direction that reduces the error</text>
<line x1="366" y1="148" x2="494" y2="148" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="650" y1="206" x2="650" y2="294" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="494" y1="352" x2="366" y2="352" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="210" y1="294" x2="210" y2="206" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="430" y="246" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">next step</text>
<text x="430" y="268" font-size="12.5" fill="#5f6b7a" text-anchor="middle">with new cells</text>
<text x="28" y="438" font-size="12.5" fill="#5f6b7a">4 000 steps × 32 768 cells: each of the 2.3 million grid cells gets its turn about 56 times on average.</text>
</svg>