<text x="260.0" y="340.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">100 m</text>
<text x="260.0" y="356.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">→ 10 000 m²</text>
<rect x="336.0" y="140.0" width="160.0" height="160.0" fill="#2a86b0" fill-opacity="0.35" stroke="#2a86b0"/>
<text x="416.0" y="322.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell D</text>
