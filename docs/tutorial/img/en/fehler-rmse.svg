<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="RMSE as squares: each error becomes a square, the RMSE is the side of the mean square">
<rect width="860" height="400" rx="12" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">RMSE: errors become squares</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Each error gives a square. The RMSE is the side length of a square with the mean area.</text>
<rect x="60.0" y="268.0" width="32.0" height="32.0" fill="#b8c1cc" fill-opacity="1" stroke="#8a96a3"/>
