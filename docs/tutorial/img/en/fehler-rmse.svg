<text x="76.0" y="340.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">100 m</text>
<text x="76.0" y="356.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">→ 10 000 m²</text>
