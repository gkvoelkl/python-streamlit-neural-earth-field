<text x="572.0" y="356.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">→ 10 000 m²</text>
<text x="622.0" y="270.0" font-size="22" fill="#5f6b7a" text-anchor="middle">→</text>
<rect x="658.0" y="222.9" width="77.1" height="77.1" fill="none" stroke="#1f2933" stroke-width="2" stroke-dasharray="6 4"/>
<text x="696.5" y="322.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">mean square</text>
<text x="696.5" y="340.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">58 000 m²</text>
<text x="696.5" y="356.0" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="600">side = RMSE = 241 m</text>
