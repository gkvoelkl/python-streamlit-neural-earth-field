<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="From weather stations to the grid points">
<rect width="940" height="470" rx="12" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">From weather stations to the grid</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Simplified: two stations and a grid point between them, in a section through a mountain range. The grid points are 0.5° (about 56 km) apart.</text>
<!-- elevation axis: 0 m at y=380, 0.1 px per m -->
<text x="64.0" y="384.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">0 m</text>
<text x="64.0" y="284.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">1 000 m</text>
<text x="64.0" y="184.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">2 000 m</text>
<line x1="70" x2="560" y1="280" y2="280" stroke="#e4e7eb" stroke-width="1"/>
<line x1="70" x2="560" y1="180" y2="180" stroke="#e4e7eb" stroke-width="1"/>
<!-- terrain -->
<path d="M70,347 C85,344 90,342 110,340 C150,336 190,300 230,240 C260,195 280,165 300,160 C325,156 345,175 380,200 C410,220 440,222 470,220 C500,218 530,232 560,250 L560,380 L70,380 Z" fill="#f1ead8" stroke="#b7a37a" stroke-width="1.6"/>
<!-- sea level line -->
<line x1="70" x2="560" y1="380" y2="380" stroke="#2b6cb0" stroke-width="1.6"/>
<text x="556.0" y="398.0" font-size="12" fill="#2b6cb0" text-anchor="end">Sea level</text>
<!-- grid point column -->
<line x1="300" x2="300" y1="174" y2="380" stroke="#e8833a" stroke-width="1.2" stroke-dasharray="4 4"/>
<!-- step 2: stations down to sea level -->
<line x1="110" x2="110" y1="346" y2="372" stroke="#5f6b7a" stroke-width="1.6"/>
<polygon points="110,379 105,370 115,370" fill="#5f6b7a"/>
<line x1="470" x2="470" y1="226" y2="372" stroke="#5f6b7a" stroke-width="1.6"/>
<polygon points="470,379 465,370 475,370" fill="#5f6b7a"/>
<text x="118.0" y="368.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600">13.4 °C</text>
<text x="462.0" y="368.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600">13.0 °C</text>
<!-- step 3: interpolation along sea level -->
<line x1="160" x2="288" y1="420" y2="420" stroke="#5f6b7a" stroke-width="1.6"/>
<polygon points="296,420 287,415 287,425" fill="#5f6b7a"/>
<line x1="420" x2="312" y1="420" y2="420" stroke="#5f6b7a" stroke-width="1.6"/>
<polygon points="304,420 313,415 313,425" fill="#5f6b7a"/>
<line x1="110" x2="110" y1="384" y2="420" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="470" x2="470" y1="384" y2="420" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="110" x2="160" y1="420" y2="420" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="420" x2="470" y1="420" y2="420" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="300" cy="380" r="5.5" fill="#ffffff" stroke="#e8833a" stroke-width="2"/>
<text x="300.0" y="446.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">13.2 °C at sea level</text>
<!-- step 4: back up to the grid point -->
<line x1="312" x2="312" y1="372" y2="174" stroke="#e8833a" stroke-width="1.8"/>
<polygon points="312,166 307,175 317,175" fill="#e8833a"/>
<text x="320.0" y="300.0" font-size="12" fill="#e8833a" text-anchor="start">− 2.2 km × 6 °C/km</text>
<text x="320.0" y="316.0" font-size="12" fill="#e8833a" text-anchor="start">= − 13.2 °C</text>
<!-- stations -->
<line x1="110" x2="110" y1="340" y2="318" stroke="#2b6cb0" stroke-width="2"/>
<circle cx="110" cy="314" r="6" fill="#2b6cb0"/>
<text x="110.0" y="282.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Station A</text>
<text x="110.0" y="298.0" font-size="12" fill="#5f6b7a" text-anchor="middle">400 m · 11.0 °C</text>
<line x1="470" x2="470" y1="220" y2="198" stroke="#2b6cb0" stroke-width="2"/>
<circle cx="470" cy="194" r="6" fill="#2b6cb0"/>
<text x="470.0" y="162.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Station B</text>
<text x="470.0" y="178.0" font-size="12" fill="#5f6b7a" text-anchor="middle">1 600 m · 3.4 °C</text>
<!-- grid point on the terrain -->
<polygon points="300,150 309,160 300,170 291,160" fill="#e8833a"/>
<text x="300.0" y="112.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Grid point: 0.0 °C</text>
<text x="300.0" y="128.0" font-size="12" fill="#5f6b7a" text-anchor="middle">2 200 m from the elevation model</text>
<!-- steps -->
<rect x="590" y="92" width="322" height="356" rx="10" fill="#f3f4f6" stroke="#e4e7eb" stroke-width="1.5"/>
<text x="608.0" y="120.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="600">In four steps</text>
<text x="608.0" y="150.0" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="600">1. Measure</text>
<text x="608.0" y="168.0" font-size="12" fill="#1f2933" text-anchor="start">Each station provides its mean, measured</text>
<text x="608.0" y="184.0" font-size="12" fill="#1f2933" text-anchor="start">at its own elevation.</text>
<text x="608.0" y="214.0" font-size="12.5" fill="#5f6b7a" text-anchor="start" font-weight="600">2. Convert to sea level</text>
<text x="608.0" y="232.0" font-size="12" fill="#1f2933" text-anchor="start">Add 6 °C per km: A 11.0 + 2.4 = 13.4 °C,</text>
<text x="608.0" y="248.0" font-size="12" fill="#1f2933" text-anchor="start">B 3.4 + 9.6 = 13.0 °C.</text>
<text x="608.0" y="278.0" font-size="12.5" fill="#5f6b7a" text-anchor="start" font-weight="600">3. Spread between the stations</text>
<text x="608.0" y="296.0" font-size="12" fill="#1f2933" text-anchor="start">Weighted by distance: the closer</text>
<text x="608.0" y="312.0" font-size="12" fill="#1f2933" text-anchor="start">station counts more. Result 13.2 °C.</text>
<text x="608.0" y="342.0" font-size="12.5" fill="#e8833a" text-anchor="start" font-weight="600">4. To the elevation of the grid point</text>
<text x="608.0" y="360.0" font-size="12" fill="#1f2933" text-anchor="start">The elevation comes from an elevation model:</text>
<text x="608.0" y="376.0" font-size="12" fill="#1f2933" text-anchor="start">13.2 − 2.2 × 6 = 0.0 °C.</text>
<text x="608.0" y="410.0" font-size="11.5" fill="#5f6b7a" text-anchor="start">Where there are few stations, the grid values</text>
<text x="608.0" y="426.0" font-size="11.5" fill="#5f6b7a" text-anchor="start">consist mostly of assumptions.</text>
</svg>
