<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Weighted RMSE: squared errors are weighted by the area of the cell">
<rect width="860" height="440" rx="12" fill="#ffffff"/>
<text x="28.0" y="40.0" font-size="19" fill="#1f2933" text-anchor="start" font-weight="600">Weighted RMSE: large cells count more</text>
<text x="28.0" y="64.0" font-size="13.5" fill="#5f6b7a" text-anchor="start">Bar height = squared error, bar width = area weight of the cell. The bar area is the contribution to the mean.</text>
<line x1="100" x2="760" y1="330.0" y2="330.0" stroke="#8a96a3"/>
<text x="92.0" y="334.0" font-size="11.5" fill="#5f6b7a" text-anchor="end">0</text>
<line x1="100" x2="760" y1="285.8" y2="285.8" stroke="#e3e8ed"/>
<text x="92.0" y="289.8" font-size="11.5" fill="#5f6b7a" text-anchor="end">50 000</text>
<line x1="100" x2="760" y1="241.5" y2="241.5" stroke="#e3e8ed"/>
<text x="92.0" y="245.5" font-size="11.5" fill="#5f6b7a" text-anchor="end">100 000</text>
<line x1="100" x2="760" y1="197.3" y2="197.3" stroke="#e3e8ed"/>
<text x="92.0" y="201.3" font-size="11.5" fill="#5f6b7a" text-anchor="end">150 000</text>
<line x1="100" x2="760" y1="153.1" y2="153.1" stroke="#e3e8ed"/>
<text x="92.0" y="157.1" font-size="11.5" fill="#5f6b7a" text-anchor="end">200 000</text>
<line x1="100" x2="760" y1="108.8" y2="108.8" stroke="#e3e8ed"/>
<text x="92.0" y="112.8" font-size="11.5" fill="#5f6b7a" text-anchor="end">250 000</text>
<text x="28.0" y="88.0" font-size="12" fill="#5f6b7a" text-anchor="start">Error² [m²]</text>
<rect x="120.0" y="321.2" width="90.0" height="8.8" fill="#2a86b0" fill-opacity="0.75" stroke="#2a86b0"/>
<text x="165.0" y="352.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell A</text>
<text x="165.0" y="370.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">0° latitude</text>
<text x="165.0" y="386.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">Weight 1.50</text>
<rect x="285.0" y="321.2" width="78.0" height="8.8" fill="#2a86b0" fill-opacity="0.68" stroke="#2a86b0"/>
<text x="324.0" y="352.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell B</text>
<text x="324.0" y="370.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">30° latitude</text>
<text x="324.0" y="386.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">Weight 1.30</text>
<rect x="438.0" y="321.2" width="63.6" height="8.8" fill="#2a86b0" fill-opacity="0.60" stroke="#2a86b0"/>
<text x="469.8" y="352.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell C</text>
<text x="469.8" y="370.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">45° latitude</text>
<text x="469.8" y="386.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">Weight 1.06</text>
<rect x="576.6" y="108.8" width="45.0" height="221.2" fill="#2a86b0" fill-opacity="0.50" stroke="#2a86b0"/>
<text x="599.1" y="352.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell D</text>
<text x="599.1" y="370.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">60° latitude</text>
<text x="599.1" y="386.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">Weight 0.75</text>
<rect x="696.6" y="321.2" width="23.4" height="8.8" fill="#2a86b0" fill-opacity="0.38" stroke="#2a86b0"/>
<text x="708.3" y="352.0" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600">Cell E</text>
<text x="708.3" y="370.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">75° latitude</text>
<text x="708.3" y="386.0" font-size="11.5" fill="#5f6b7a" text-anchor="middle">Weight 0.39</text>
<text x="28.0" y="420.0" font-size="12.5" fill="#1f2933" text-anchor="start">Without weights: RMSE = 241 m. With weights: 214 m – the large error in cell D at 60° latitude counts only 0.75 times.</text>
</svg>